<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moja strona</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f9;
      color: #333;
    }

    header {
      background: #4a90e2;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #333;
    }

    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
    }

    nav a:hover {
      background: #555;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #333;
      color: white;
      margin-top: 20px;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #4a90e2;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #357ABD;
    }
  </style>
</head>
<body>

<header>
  <h1>Witaj na mojej stronie</h1>
  <p>Prosta strona HTML + CSS + JS</p>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#about">O mnie</a>
  <a href="#contact">Kontakt</a>
</nav>

<div class="container">

  <div class="card" id="home">
    <h2>Strona główna</h2>
    <p>To jest przykładowa strona internetowa stworzona w HTML.</p>
    <button onclick="showMessage()">Kliknij mnie</button>
    <p id="message"></p>
  </div>

  <div class="card" id="about">
    <h2>O mnie</h2>
    <p>Tutaj możesz napisać coś o sobie.</p>
  </div>

  <div class="card" id="contact">
    <h2>Kontakt</h2>
    <p>Email: przyklad@email.com</p>
  </div>

</div>

<footer>
  <p>&copy; 2026 Moja strona</p>
</footer>

<script>
  function showMessage() {
    document.getElementById("message").innerText = "Cześć! Działa JavaScript 🙂";
  }
</script>

</body>
</html>
